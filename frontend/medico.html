<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
  <style>
.btn-tv {
  background: #28a745;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  margin-top: 8px;
}
.btn-tv:hover { background: #1e7e34; }
.btn-abrir-tv {
  background: #17a2b8;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 14px;
  cursor: pointer;
}
.btn-abrir-tv:hover { background: #117a8b; }
.consutorio-input {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  background: #f0f0f0;
  padding: 10px 14px;
  border-radius: 6px;
  border: 1px solid #d0d8f0;
}
.consutorio-input label { font-weight: bold; }
.consutorio-input input {
  width: 60px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  padding: 4px 8px;
  border: 1px solid #ccc;
  border-radius: 4px; 
}

  </style>
</head>

<body>
  <header class="topo">
    <div class="logo">
        <span class="icone">🏥</span>
        <div>
            <h1>Hospital Pro</h1>
            <p>Cuidando da vida com excelência</p>
        </div>
    </div>
</header>


<div class="container">

  <!-- Cabeçalho em botão da TV -->
<div style="display:flex; justify-content: space-between;
align-items: center;
margin-bottom: 20px;">
<h2 style="margin-top:0;">🩺 Painel Médico</h2>
<button class="btn-abrir-tv"
    onclick="window.open('tv.html', '_blank')"
      >
        📺 Abrir Tela da TV
      </button>
      </div>
<!-- 
    Campo  criado para infprmar o consutorio e chamar o paciente na TV -->
    <div class="consutorio-input">
      <label>Meu consutório:</label>
      <input type="text" id="consutorio-num" value="01">
      <span style="color: #666; font-size:13px;">Este número será exibido na TV ao chamar o paciente.
      </span>
    </div>
  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {
      triagensCarregadas = data;

      const div = document.getElementById("triagens");
      div.innerHTML = "";

      data.forEach((t, index) => {
        div.innerHTML += `
          <div class="card">
            <h3>${t.nome}</h3>

            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>

            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>

            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>

            <button onclick="selecionar(${index})">
              Atender
            </button>
          </div>
        `;
      });
    });
}

function selecionar(index) {
  const t = triagensCarregadas[index];

  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente clicando em Atender.");
    return;
  }

  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      paciente,
      diagnostico,
      medicacao,
      obs
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva");

    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
  });
}

carregar();
carregarMedicacoes();

</script>

</body>
</html>
