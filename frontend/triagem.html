<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Triagem Hospitalar</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow:hidden;
}

/* Painel */

.container{

    width:520px;

    background:rgba(18,18,18,.92);

    border:2px solid #9d7c3f;

    border-radius:15px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 0 40px #000,
    inset 0 0 25px rgba(255,255,255,.05);

}
/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

h1{

    font-size:60px;

    text-shadow:0 0 20px gold;

}

h1 img{

    width: 50%;
    
}

p{

    color:#c9a34f;

    letter-spacing:5px;

    margin:10px 0;

}

h2{

    color:#f4e6c6;

    margin-bottom:25px;

}

/* Campos */

input,
select,
textarea{

    width:100%;

    margin:12px 0;

    padding:15px;

    border:none;

    border-radius:8px;

    background:#2c2c2c;

    color:white;

    font-size:15px;

    font-family:'Cinzel',serif;

    outline:none;

    transition:.3s;

}

input::placeholder,
textarea::placeholder{

    color:#b8b8b8;

}

input:focus,
select:focus,
textarea:focus{

    background:#3a3a3a;

    box-shadow:0 0 15px #b48a39;

}

textarea{

    height:120px;

    resize:none;

}

/* Resultado */

#resultado{

    margin-top:20px;

    padding:15px;

    border-radius:8px;

    font-size:18px;

    font-weight:bold;

    display:none;

}

.vermelho{

    display:block;

    background:#6b0000;

    color:white;

    border:2px solid red;

}

.amarelo{

    display:block;

    background:#7d6300;

    color:white;

    border:2px solid gold;

}

.verde{

    display:block;

    background:#124d16;

    color:white;

    border:2px solid limegreen;

}

/* Botão */

button{

    width:100%;

    margin-top:25px;

    padding:16px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    color:#111;

    background:linear-gradient(#e3c77f,#9f7635);

    transition:.3s;

}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);

}

button:active{

    transform:scale(.98);

}

.footer{

    margin-top:20px;

    color:#888;

    font-size:12px;

    letter-spacing:2px;

}

/* new style */

.btn-tv{ background: green; color: #fff; border: none; padding: 8px 1px; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 8px;}

.btn-tv:hover { background: greenyellow;}

.pacientes-fila { margin-bottom: 30px; background: #fff; border-radius: 8px; padding: 16px; border:  1px solid #c1dbf0; }

.pacientes-fila h3{ margin-top: 0; color: #333; display: flex; justify-content: space-between; align-items: center;}

.pacientes-fila h3 span { font-size: 13px; font-weight: normal; color: #666;}

.fila-item { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; border: 1px solid #dce4ff;}

.fila-item strong { font-size: 15px; }
.fila-item small { color: #888; font-size: 12px; }

.btn-abrir-tv { display: inline-block; background: rgb(0, 166, 255); color: #fff; padding: 8px 14px; border-radius: 5px; font-size: 14px; text-decoration: none; cursor: pointer; border: none;}

.btn-abrir-tv:hover { background: #117a8b;}

</style>

</head>

<body>

<div class="container">

    

<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>Triagem Hospitalar</h2>

<input id="nome" placeholder="Nome do Paciente">

<select id="sintoma">

<option value="">Selecione o Sintoma</option>

<option value="dor_leve">Dor leve</option>

<option value="resfriado">Resfriado</option>

<option value="coriza">Coriza</option>

<option value="tosse">Tosse</option>

<option value="febre">Febre</option>

<option value="vomito">Vômito</option>

<option value="diarreia">Diarreia</option>

<option value="falta_ar_moderada">Falta de ar moderada</option>

<option value="falta_ar_grave">Falta de ar grave</option>

<option value="infarto">Suspeita de infarto</option>

<option value="avc">Suspeita de AVC</option>

<option value="convulsao">Convulsão</option>

<option value="hemorragia">Hemorragia</option>

</select>

<input
id="temp"
type="number"
placeholder="Temperatura (°C)"
>

<input
id="alergia"
placeholder="Alergias"
>

<textarea
id="observacao"
placeholder="Observações da Triagem"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
Salvar Triagem
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

<!-- cabeçalho com botão da Tv -->
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <!-- <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2> -->
        <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da Tv</button>
     </div>

<!-- Fila de paciente do Atendimento criada para mostrar quem pode ser chamado tv -->
     <div class="pacientes-fila">
        <h3>
             Paciente cadastrado no Atendimento
                <span>Cliquem em Chamar na "TV" para chamar ao guichê</span>
        </h3>
        <div id="fila-pacientes">
            <p style="color: #888; text-align: center;">Carregar...</p>
        </div>
        <button onclick="carregarPacientes()" style="margin-top: 8px; background: #6c757b; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">🔁 Atualizar lista</button>
     </div>

</div>

<script>

function classificarRisco(sintoma, temperatura){

const vermelhos=[
"infarto",
"avc",
"convulsao",
"hemorragia",
"falta_ar_grave"
];

const amarelos=[
"febre",
"vomito",
"diarreia",
"falta_ar_moderada"
];

if(temperatura>=39) return "vermelho";

if(vermelhos.includes(sintoma)) return "vermelho";

if(amarelos.includes(sintoma)) return "amarelo";

return "verde";

}

function salvar(){

const nome=document.getElementById("nome").value;

const sintoma=document.getElementById("sintoma").value;

const temperatura=Number(document.getElementById("temp").value);

const alergia=document.getElementById("alergia").value;

const observacao=document.getElementById("observacao").value;

const risco=classificarRisco(sintoma,temperatura);

fetch("http://localhost:3000/triagem",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nome,
sintoma,
temperatura,
alergia,
observacao,
risco

})

})

.then(r=>r.json())

.then(()=>{

const resultado=document.getElementById("resultado");

resultado.className=risco;

resultado.innerHTML="Classificação de Risco: <b>"+risco.toUpperCase()+"</b>";

alert("Triagem salva com sucesso.");

});

}

function carregarPacientes() {
    fetch("/pacientes")
     .then(r => r.json())
     .then(pacientes => {
        const div = document.getElementById("fila-pacientes");

        // Mostar apenas os com status "triagem"
        const fila = pacientes.filter(p => p.status === "triagem");

        if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align: center;'>Nenhum Paciente aguardando </p>";
        return;
        }

        div.innerHTML = "";
        fila.forEach(p => {
            const item = document.createElement("div");
            item.className = 'fila-item';
            item.innerHTML = `
            <div>
                <strong>${p.nome}</strong><br>
                <small>CPF: ${p.cpf || "-"} | Tipo: ${p.tipo || "-"}</small>
            </div>
            <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">chamr na tv</button>
            `;
            div.appendChild(item);
        });
     })
     .catch(() => {
        document.getElementById("fila-pacientes").innerHTML = "<p style='color:red;'>Erro ao carregar paciente.</p>";
     });
}

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no guichê.
function chamarNaTV(nome){
    fetch("/tv/chamar", {
        method: "POST",
        headers: {"Content-type" : "application/json" },
        body: JSON.stringify({
            localTipo: "GUICHÊ",
            localNumero: "01",
            paciente: nome
        })
    })
    .then(r => r.json())
    .then(() => {
        alert("✅ " + nome + " foi chamado na TV para o Guichê 01!")
    })
}

// carregar a fila ao abrir a página
carregarPacientes();

//atualizar lista altomaticamente a cada 10 segundos
setInterval(carregarPacientes, 10000)

</script>

</body>

</html>
